services:
  job-api:
    build:
      context: ./job-api
      dockerfile: Dockerfile
    container_name: job-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JAVA_OPTS=-Xmx512m -Xms256m
    networks:
      - job-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  job-finder:
    build:
      context: ./job-finder
      dockerfile: Dockerfile
    container_name: job-finder
    ports:
      - "80:80"
    depends_on:
      job-api:
        condition: service_healthy
    networks:
      - job-network
    restart: unless-stopped

networks:
  job-network:
    driver: bridge
    name: job-network